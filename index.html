<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✮ Syafizam Photobooth Premium ✮</title>
    <style>
        :root {
            --accent: #ff79c6;
            --dark: #0b0b0e;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Dekorasi Bintang & Simbol */
        .decor-top { font-size: 24px; margin-bottom: 10px; color: var(--accent); }

        .main-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        video {
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
            background: #000;
        }

        #timer {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px; font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: none;
            z-index: 5;
        }

        /* Customization UI */
        .ui-panel {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group { text-align: left; }
        label { font-size: 12px; color: #aaa; margin-left: 10px; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .btn-row { display: flex; gap: 10px; justify-content: center; }
        
        .opt-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 15px;
            border-radius: 20px; cursor: pointer;
        }

        .opt-btn.active { background: var(--accent); border-color: var(--accent); }

        #snap-btn {
            background: linear-gradient(45deg, var(--accent), #bd93f9);
            border: none; padding: 15px;
            border-radius: 15px; color: white;
            font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-top: 10px;
        }

        /* Result Preview */
        .result-container {
            margin-top: 40px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .strip-frame {
            background: white; /* Background frame putih macam gambar kau bagi */
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        canvas { max-width: 100%; height: auto; }

        .dl-btn {
            background: #50fa7b; color: #000;
            padding: 15px 40px; border-radius: 50px;
            border: none; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="decor-top">✮♡♥︎♪♫♬</div>
    <h2 style="margin-top: 0;">Syafizam Premium Booth</h2>

    <div class="main-card">
        <video id="video" autoplay playsinline></video>
        <div id="timer">3</div>

        <div class="ui-panel">
            <div class="input-group">
                <label>Tulis Tajuk Anda (Edit Text):</label>
                <input type="text" id="userText" placeholder="Contoh: My Lovely Moment">
            </div>

            <div class="input-group">
                <label>Bilangan Gambar:</label>
                <div class="btn-row">
                    <button class="opt-btn" onclick="setCount(2)">2</button>
                    <button class="opt-btn active" onclick="setCount(3)">3</button>
                    <button class="opt-btn" onclick="setCount(4)">4</button>
                </div>
            </div>

            <button id="snap-btn">START SESSION 📸</button>
        </div>
    </div>

    <div class="result-container" id="resultArea">
        <h3 style="color: var(--accent);">✮ Preview Hasil ✮</h3>
        <div class="strip-frame">
            <canvas id="stripCanvas"></canvas>
        </div>
        <button class="dl-btn" id="dlBtn">DOWNLOAD HD IMAGE 📥</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const timerEl = document.getElementById('timer');
        const snapBtn = document.getElementById('snap-btn');
        const userText = document.getElementById('userText');
        const resultArea = document.getElementById('resultArea');
        const stripCanvas = document.getElementById('stripCanvas');

        let shotCount = 3;
        let photos = [];

        // Camera High Res
        navigator.mediaDevices.getUserMedia({ video: { width: 1920, height: 1080 } })
            .then(s => video.srcObject = s);

        function setCount(n) {
            shotCount = n;
            document.querySelectorAll('.opt-btn').forEach(b => {
                b.classList.toggle('active', b.innerText == n);
            });
        }

        snapBtn.onclick = async () => {
            photos = [];
            resultArea.style.display = 'none';
            snapBtn.disabled = true;

            for (let i = 0; i < shotCount; i++) {
                timerEl.style.display = 'block';
                for (let c = 3; c > 0; c--) {
                    timerEl.innerText = c;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerEl.style.display = 'none';

                // Capture Frame
                const temp = document.createElement('canvas');
                temp.width = video.videoWidth;
                temp.height = video.videoHeight;
                const tCtx = temp.getContext('2d');
                tCtx.translate(temp.width, 0);
                tCtx.scale(-1, 1);
                tCtx.drawImage(video, 0, 0);
                photos.push(temp.toDataURL('image/jpeg', 1.0));
                
                await new Promise(r => setTimeout(r, 600));
            }
            drawStrip();
            snapBtn.disabled = false;
        };

        function drawStrip() {
            const ctx = stripCanvas.getContext('2d');
            const w = 800; // Lebar gambar (HD)
            const h = 600; // Tinggi gambar
            const pad = 40; // Ruang putih antara gambar
            const header = 150; // Ruang untuk teks atas
            const footer = 100; // Ruang untuk watermark

            stripCanvas.width = w + (pad * 2);
            stripCanvas.height = (h * shotCount) + (pad * (shotCount + 1)) + header + footer;

            // Background Putih Bersih
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

            // Lukis Header Text (User Input)
            ctx.fillStyle = "black";
            const title = userText.value || "✮ My Photo Story ✮";
            ctx.font = "bold 45px 'Arial'";
            ctx.textAlign = "center";
            ctx.fillText(title, stripCanvas.width / 2, 80);
            
            ctx.font = "24px 'Arial'";
            ctx.fillText("✮♡♥︎♪♫♬", stripCanvas.width / 2, 120);

            let loaded = 0;
            photos.forEach((src, i) => {
                const img = new Image();
                img.onload = () => {
                    const y = header + pad + (i * (h + pad));
                    
                    // Draw image with rounded corners effect using clip
                    ctx.save();
                    roundRect(ctx, pad, y, w, h, 20); // 20px radius
                    ctx.clip();
                    ctx.drawImage(img, pad, y, w, h);
                    ctx.restore();

                    // Stickers on corners
                    ctx.font = "40px Arial";
                    ctx.fillText("♥︎", pad + 40, y + 50); // Top left
                    ctx.fillText("✮", pad + w - 40, y + h - 20); // Bottom right

                    loaded++;
                    if (loaded === shotCount) {
                        // Watermark Syafizam
                        ctx.fillStyle = "#888";
                        ctx.font = "italic 22px Arial";
                        ctx.fillText("created by Syafizam♥︎", stripCanvas.width / 2, stripCanvas.height - 40);
                        
                        resultArea.style.display = 'flex';
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }
                };
                img.src = src;
            });
        }

        // Helper untuk rounded corners
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        document.getElementById('dlBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = `SyafizamBooth_${Date.now()}.png`;
            link.href = stripCanvas.toDataURL('image/png', 1.0);
            link.click();
        };
    </script>
</body>
</html>
