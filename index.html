<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syafizam Cyber Photobooth</title>
    <style>
        :root {
            --primary: #ff4d4d;
            --bg: #0a0a0a;
            --card: #1a1a1a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .camera-container {
            position: relative;
            background: var(--card);
            border: 4px solid var(--primary);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.3);
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* Mirror view */
        }

        #timer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 15px black;
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #status {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #aaa;
        }

        /* Preview Area */
        #preview-canvas {
            display: none;
            max-width: 200px;
            border: 2px solid white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 SYAFIZAM PHOTOBOOTH</h1>
        <p>Cybersecurity Expert Edition</p>

        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div id="timer">3</div>
        </div>

        <div class="controls">
            <button id="startBtn">MULA SESI (4 GAMBAR)</button>
        </div>

        <div id="status">Sedia untuk beraksi...</div>
        
        <canvas id="hiddenCanvas" style="display:none;"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const timerEl = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const hiddenCanvas = document.getElementById('hiddenCanvas');

        let capturedImages = [];
        const TOTAL_SHOTS = 4;
        const COUNTDOWN_TIME = 3;

        // Akses Kamera
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                statusEl.innerText = "Error: Kamera tidak dijumpai!";
                console.error(err);
            }
        }

        // Fungsi Ambil Gambar (Single Frame)
        function captureFrame() {
            const ctx = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = video.videoWidth;
            hiddenCanvas.height = video.videoHeight;
            
            // Mirroring balik supaya gambar tak terbalik
            ctx.translate(hiddenCanvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            
            return hiddenCanvas.toDataURL('image/png');
        }

        // Logik Sesi Foto
        startBtn.addEventListener('click', async () => {
            capturedImages = [];
            startBtn.disabled = true;
            
            for (let i = 1; i <= TOTAL_SHOTS; i++) {
                statusEl.innerText = `Sedia untuk gambar ke-${i}...`;
                
                // Countdown Logic
                timerEl.style.display = 'block';
                for (let count = COUNTDOWN_TIME; count > 0; count--) {
                    timerEl.innerText = count;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerEl.style.display = 'none';

                // Flash effect (Simulasi)
                video.style.opacity = '0.5';
                const imgData = captureFrame();
                capturedImages.push(imgData);
                setTimeout(() => video.style.opacity = '1', 100);

                statusEl.innerText = `Gambar ${i} berjaya diambil!`;
                await new Promise(r => setTimeout(r, 1000));
            }

            statusEl.innerText = "Sedang menjana Photo Strip...";
            generateStrip();
        });

        // Gabungkan ke format Strip "Don't Look Up"
        function generateStrip() {
            const stripCanvas = document.createElement('canvas');
            const ctx = stripCanvas.getContext('2d');

            const w = 600; // Lebar strip
            const h = 450; // Tinggi satu gambar
            const padding = 40;
            const bottomSpace = 150; // Ruang untuk teks di bawah

            stripCanvas.width = w + (padding * 2);
            stripCanvas.height = (h * TOTAL_SHOTS) + (padding * (TOTAL_SHOTS + 1)) + bottomSpace;

            // Background Putih (atau Hitam ikut suka awak)
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

            let loadedCount = 0;
            capturedImages.forEach((src, index) => {
                const img = new Image();
                img.onload = () => {
                    const y = padding + (index * (h + padding));
                    ctx.drawImage(img, padding, y, w, h);
                    
                    loadedCount++;
                    if (loadedCount === TOTAL_SHOTS) {
                        // Tambah Teks "DON'T LOOK UP" atau Brand awak
                        ctx.fillStyle = "black";
                        ctx.font = "bold 40px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("DON'T LXXXK UP", stripCanvas.width / 2, stripCanvas.height - 80);
                        
                        ctx.font = "20px Arial";
                        ctx.fillText("SYAFIZAM CYBERSECURITY EDITION", stripCanvas.width / 2, stripCanvas.height - 40);

                        downloadResult(stripCanvas);
                    }
                };
                img.src = src;
            });
        }

        function downloadResult(canvas) {
            const link = document.createElement('a');
            link.download = `Syafizam_Photobooth_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            statusEl.innerText = "Selesai! Gambar telah dimuat turun.";
            startBtn.disabled = false;
        }

        setupCamera();
    </script>
</body>
</html>
