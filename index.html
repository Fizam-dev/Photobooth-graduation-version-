<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Cute Cyber Photobooth ✨</title>
    <style>
        :root {
            --accent: #ff79c6; /* Pink Cute */
            --bg: #282a36;    /* Dark Theme */
            --panel: #44475a;
            --text: #f8f8f2;
        }

        body {
            font-family: 'Segoe UI', cursive, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header & Decorations */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 121, 198, 0.5);
            margin: 10px 0;
        }

        /* Camera Box */
        .main-card {
            background: var(--panel);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            transform: scaleX(-1);
        }

        #timer-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: var(--accent);
            pointer-events: none;
            display: none;
        }

        /* Controls */
        .setup-zone {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .choice-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .choice-btn.active {
            background: var(--accent);
            color: white;
        }

        #snap-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        #snap-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Preview Area */
        .result-zone {
            margin-top: 30px;
            display: none; /* Hidden until photo taken */
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .strip-preview {
            background: white;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            max-width: 300px;
        }

        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }

        .download-btn {
            background: #50fa7b; /* Green */
            color: #282a36;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .cute-decor { font-size: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="cute-decor">✨ 🧸 🎀 🧸 ✨</div>
        <h1>SYAFIZAM PHOTO STORY</h1>
        <p>Tangkap memori unik anda di sini!</p>
    </div>

    <div class="main-card">
        <video id="video" autoplay playsinline></video>
        <div id="timer-overlay">3</div>

        <div class="setup-zone">
            <div style="text-align:center">Pilih bilangan gambar:</div>
            <div class="btn-group">
                <button class="choice-btn" onclick="setShots(2)">2 Gambar</button>
                <button class="choice-btn active" onclick="setShots(3)">3 Gambar</button>
                <button class="choice-btn" onclick="setShots(4)">4 Gambar</button>
            </div>
            <button id="snap-btn">MULAI SESI FOTO 📸</button>
        </div>
    </div>

    <div class="result-zone" id="resultZone">
        <h3>✨ Preview Hasil ✨</h3>
        <div class="strip-preview">
            <canvas id="mainCanvas"></canvas>
        </div>
        <button class="download-btn" id="downloadBtn">SIMPAN GAMBAR 📥</button>
        <p style="font-size: 0.8rem; margin-top:10px;">*Klik simpan untuk kualiti HD</p>
    </div>

    <script>
        const video = document.getElementById('video');
        const timerEl = document.getElementById('timer-overlay');
        const snapBtn = document.getElementById('snap-btn');
        const resultZone = document.getElementById('resultZone');
        const mainCanvas = document.getElementById('mainCanvas');
        const downloadBtn = document.getElementById('downloadBtn');

        let totalShots = 3;
        let capturedFrames = [];

        // 1. Setup Camera
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("Kamera tidak diakses!"));

        // 2. Pilih jumlah gambar
        function setShots(num) {
            totalShots = num;
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(num));
            });
        }

        // 3. Ambil Gambar
        snapBtn.onclick = async () => {
            capturedFrames = [];
            snapBtn.disabled = true;
            resultZone.style.display = 'none';

            for (let i = 0; i < totalShots; i++) {
                // Countdown
                timerEl.style.display = 'block';
                for (let c = 3; c > 0; c--) {
                    timerEl.innerText = c;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerEl.style.display = 'none';

                // Capture
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const ctx = tempCanvas.getContext('2d');
                ctx.translate(tempCanvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0);
                capturedFrames.push(tempCanvas.toDataURL('image/jpeg', 0.9));
                
                // Gap
                await new Promise(r => setTimeout(r, 500));
            }

            renderStrip();
            snapBtn.disabled = false;
        };

        // 4. Generate Strip (Preview Mode)
        function renderStrip() {
            const ctx = mainCanvas.getContext('2d');
            const w = 600; 
            const h = 450;
            const pad = 30;
            const headerSpace = 100;

            mainCanvas.width = w + (pad * 2);
            mainCanvas.height = (h * totalShots) + (pad * (totalShots + 1)) + headerSpace;

            // Background Putih Bersih
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

            // Header Teks Menarik di Atas
            ctx.fillStyle = "#ff79c6";
            ctx.font = "bold 35px 'Comic Sans MS', cursive";
            ctx.textAlign = "center";
            ctx.fillText("✨ PHOTO STORY ✨", mainCanvas.width / 2, 60);
            
            ctx.fillStyle = "#444";
            ctx.font = "16px Arial";
            ctx.fillText("Captured by Syafizam Photobooth", mainCanvas.width / 2, 85);

            // Lukis Gambar
            let loaded = 0;
            capturedFrames.forEach((src, i) => {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, pad, headerSpace + pad + (i * (h + pad)), w, h);
                    loaded++;
                    if (loaded === totalShots) {
                        resultZone.style.display = 'flex';
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }
                };
                img.src = src;
            });
        }

        // 5. Download
        downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = `PhotoStory_${Date.now()}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        };
    </script>
</body>
</html>
