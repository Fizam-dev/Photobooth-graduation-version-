<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Syafizam Photo Story | For Someone Special ✨</title>
    <style>
        :root {
            --primary-love: #ff4d6d;
            --neon-purple: #7209b7;
            --dark-bg: #0f0c29; /* Dark Cosmic Blue */
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Stars Background */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 30px 10px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #ff4d6d, #ef476f, #ffd166);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 77, 109, 0.5));
        }

        /* Camera Box */
        .camera-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-love);
            border-radius: 25px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.2);
            position: relative;
        }

        video {
            width: 100%;
            border-radius: 15px;
            transform: scaleX(-1); /* Mirror */
        }

        #timer-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 900;
            color: var(--primary-love);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            display: none;
            z-index: 10;
        }

        /* Responsive Controls */
        .ui-controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .shot-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-shot {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary-love);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-shot.active {
            background: var(--primary-love);
            box-shadow: 0 0 15px var(--primary-love);
        }

        #action-btn {
            background: linear-gradient(45deg, #ff4d6d, #7209b7);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #action-btn:active { transform: scale(0.95); }

        /* Preview Area */
        .preview-section {
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 40px 0;
            width: 100%;
        }

        .canvas-wrapper {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 320px;
        }

        canvas { width: 100%; height: auto; }

        .dl-button {
            background: #00f5d4;
            color: #000;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 900;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>

    <div class="header">
        <h1>✨ MY PHOTO STORY ✨</h1>
        <p>Tangkap Momen Indah Bersama Syafizam 💖</p>
    </div>

    <div class="camera-card">
        <video id="webcam" autoplay playsinline></video>
        <div id="timer-box">3</div>

        <div class="ui-controls">
            <div style="text-align:center; font-size: 0.9rem;">Pilih Frame Story:</div>
            <div class="shot-selector">
                <button class="btn-shot" onclick="setShots(2)">2 Shots</button>
                <button class="btn-shot active" onclick="setShots(3)">3 Shots</button>
                <button class="btn-shot" onclick="setShots(4)">4 Shots</button>
            </div>
            <button id="action-btn">MULA SESI FOTO 📸</button>
        </div>
    </div>

    <div class="preview-section" id="previewSection">
        <h2 style="color: #ffd166;">💝 Cantiknya! Preview Dulu:</h2>
        <div class="canvas-wrapper">
            <canvas id="outputCanvas"></canvas>
        </div>
        <button class="dl-button" id="dlBtn">MUAT TURUN & SHARE! 📥</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const timerBox = document.getElementById('timer-box');
        const actionBtn = document.getElementById('action-btn');
        const previewSection = document.getElementById('previewSection');
        const outputCanvas = document.getElementById('outputCanvas');
        const dlBtn = document.getElementById('dlBtn');

        let shotCount = 3;
        let photos = [];

        // Setup Webcam
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(s => video.srcObject = s);

        function setShots(n) {
            shotCount = n;
            document.querySelectorAll('.btn-shot').forEach(b => {
                b.classList.toggle('active', b.innerText.includes(n));
            });
        }

        // Star Background Effect
        for (let i = 0; i < 50; i++) {
            let star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = '2px';
            star.style.height = '2px';
            star.style.background = '#fff';
            star.style.borderRadius = '50%';
            star.style.opacity = Math.random();
            document.getElementById('stars').appendChild(star);
        }

        actionBtn.onclick = async () => {
            photos = [];
            actionBtn.disabled = true;
            previewSection.style.display = 'none';

            for (let i = 0; i < shotCount; i++) {
                timerBox.style.display = 'block';
                for (let c = 3; c > 0; c--) {
                    timerBox.innerText = c;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerBox.style.display = 'none';

                // Capture
                const temp = document.createElement('canvas');
                temp.width = video.videoWidth;
                temp.height = video.videoHeight;
                const tCtx = temp.getContext('2d');
                tCtx.translate(temp.width, 0);
                tCtx.scale(-1, 1);
                tCtx.drawImage(video, 0, 0);
                photos.push(temp.toDataURL('image/jpeg', 1.0));
                
                await new Promise(r => setTimeout(r, 600));
            }
            renderFinalStrip();
            actionBtn.disabled = false;
        };

        function renderFinalStrip() {
            const ctx = outputCanvas.getContext('2d');
            const w = 600, h = 450, pad = 30, header = 120;
            
            outputCanvas.width = w + (pad * 2);
            outputCanvas.height = (h * shotCount) + (pad * (shotCount + 1)) + header;

            // Background
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);

            // Header Aesthetic
            ctx.fillStyle = "#ff4d6d";
            ctx.font = "bold 40px 'Arial'";
            ctx.textAlign = "center";
            ctx.fillText("✨ PHOTO STORY ✨", outputCanvas.width/2, 60);
            ctx.fillStyle = "#777";
            ctx.font = "18px Arial";
            ctx.fillText("Special Moments with Syafizam", outputCanvas.width/2, 90);

            let loaded = 0;
            photos.forEach((src, i) => {
                const img = new Image();
                img.onload = () => {
                    const y = header + pad + (i * (h + pad));
                    ctx.drawImage(img, pad, y, w, h);
                    
                    // TAMBAH STICKER PADA BUCU (CREATIVE TOUCH)
                    drawHeartSticker(ctx, pad + 10, y + 10); // Bucu atas kiri
                    drawStarSticker(ctx, pad + w - 40, y + h - 40); // Bucu bawah kanan

                    loaded++;
                    if (loaded === shotCount) {
                        previewSection.style.display = 'flex';
                        window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
                    }
                };
                img.src = src;
            });
        }

        function drawHeartSticker(ctx, x, y) {
            ctx.fillStyle = "#ff4d6d";
            ctx.font = "30px Arial";
            ctx.fillText("❤️", x + 15, y + 25);
        }

        function drawStarSticker(ctx, x, y) {
            ctx.fillStyle = "#ffd166";
            ctx.font = "30px Arial";
            ctx.fillText("⭐", x + 15, y + 25);
        }

        dlBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = `Syafizam_LoveStory_${Date.now()}.png`;
            link.href = outputCanvas.toDataURL();
            link.click();
        };
    </script>
</body>
</html>
